name: Convector heater
products:
  - id: w9yqblgcsupmkzw2
    manufacturer: Termia
    model: EBHA 1,5/230C2T
entities:
  - entity: climate
    translation_key: heater
    dps:
      - id: 1
        type: boolean
        name: hvac_mode
        mapping:
          - dps_val: false
            value: "off"
          - dps_val: true
            value: heat
      - id: 2
        type: integer
        name: temperature
        unit: C
        range:
          min: 7
          max: 30
      - id: 3
        type: integer
        name: current_temperature
      - id: 4
        type: string
        name: preset_mode
        mapping:
          - dps_val: comfort
            value: comfort
          - dps_val: eco
            value: eco
          - dps_val: antifreeze
            value: away
      - id: 11
        type: string
        name: hvac_action
        mapping:
          - dps_val: heating
            value: heating
          - dps_val: warm
            value: idle
  - entity: lock
    translation_key: child_lock
    category: config
    dps:
      - id: 7
        type: boolean
        name: lock
  - entity: select
    translation_key: mode
    category: config
    dps:
      - id: 5
        type: string
        name: option
        mapping:
          - dps_val: manual
            value: manual
          - dps_val: program
            value: schedule
